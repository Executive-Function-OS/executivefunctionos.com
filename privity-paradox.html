              <div style="font-size: 10px; letter-spacing: 2px; color: #6A6050; margin-bottom: 7px;">KEY EVENTS</div>
              <div style="display: flex; flex-wrap: wrap; gap: 5px;">
                ${phase.events.map(e => `<div style="font-size: 11px; background: ${phase.color}18; border: 1px solid ${phase.color}33; border-radius: 4px; padding: 3px 8px; color: #C8C0B0;">${e}</div>`).join('')}
              </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;">
              <div style="background: ${phase.successor.active ? '#4A7C9E15' : '#1A1A1A'}; border: 1px solid ${phase.successor.active ? '#4A7C9E44' : '#2A2520'}; border-radius: 6px; padding: 12px; opacity: ${phase.successor.active ? 1 : 0.4};">
                <div style="font-size: 10px; color: ${phase.successor.active ? '#4A7C9E' : '#555'}; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: bold;">${phase.successor.label}</div>
                <div style="font-size: 12px; color: #B0A898; line-height: 1.55; margin-bottom: 8px;">${phase.successor.text}</div>
                <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                  ${phase.successor.cites.map(renderCiteTag).join('')}
                </div>
              </div>
              <div style="background: ${phase.thirdParty.active ? '#3A7A4A15' : '#1A1A1A'}; border: 1px solid ${phase.thirdParty.active ? '#3A7A4A44' : '#2A2520'}; border-radius: 6px; padding: 12px; opacity: ${phase.thirdParty.active ? 1 : 0.4};">
                <div style="font-size: 10px; color: ${phase.thirdParty.active ? '#3A7A4A' : '#555'}; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: bold;">${phase.thirdParty.label}</div>
                <div style="font-size: 12px; color: #B0A898; line-height: 1.55; margin-bottom: 8px;">${phase.thirdParty.text}</div>
                <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                  ${phase.thirdParty.cites.map(renderCiteTag).join('')}
                </div>
              </div>
            </div>
            <div>
              <div style="font-size: 10px; letter-spacing: 2px; color: #6A6050; margin-bottom: 8px;">STRATEGIC APPLICATION — click pillar to select</div>
              <div style="display: flex; gap: 8px;">
                ${pillars.map(pillar => `
                  <div class="pillar-card" onclick="setPillar('${pillar.key}')" style="
                    background: ${state.activePillar === pillar.key ? pillar.color + '22' : '#1A1A1A'};
                    border: 1px solid ${state.activePillar === pillar.key ? pillar.color + '77' : '#2A2520'};
                  ">
                    <div style="font-size: 11px; color: ${pillar.color}; margin-bottom: 6px; font-weight: bold;">${pillar.icon} ${pillar.label}</div>
                    <div style="font-size: 11px; color: #A0988A; line-height: 1.55; margin-bottom: 8px;">${phase[pillar.key].text}</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                      ${phase[pillar.key].cites.map(renderCiteTag).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      // Preclusion Traps Grid
      html += `
        <div style="margin-bottom: 24px;">
          <div style="font-size: 10px; letter-spacing: 3px; color: #6A6050; text-transform: uppercase; margin-bottom: 10px;">▸ Preclusion Trap Immunity Grid</div>
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
      `;

      traps.forEach((trap, i) => {
        const p = phases.find(ph => ph.id === trap.phase);
        const isAct = state.activeTrap === i;
        html += `
          <div class="trap-card" onclick="toggleTrap(${i})" style="
            border: 1px solid ${isAct ? p.color + '88' : '#2A2520'};
            border-left: 3px solid ${p.color};
            background: ${isAct ? p.color + '15' : '#111820'};
          ">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div style="flex: 1;">
                <div style="font-size: 12px; color: #D4B896; font-weight: bold; margin-bottom: 3px;">${trap.attack}</div>
                <div style="font-size: 11px; color: #6A6050; font-style: italic;">"${trap.arg}"</div>
              </div>
              <div style="font-size: 9px; color: ${p.color}; letter-spacing: 1px; margin-left: 8px; white-space: nowrap;">PH.${trap.phase}</div>
            </div>
            ${isAct ? `
              <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid ${p.color}33;">
                <div style="font-size: 12px; color: #B0A898; line-height: 1.6; margin-bottom: 8px;">
                  <span style="color: #6ACA7A; font-weight: bold;">▶ DEFENSE: </span>${trap.defense}
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                  ${trap.cites.map(renderCiteTag).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      });

      html += `</div></div>`;

      // Table of Authorities
      html += `
        <div style="margin-bottom: 24px;">
          <div onclick="toggleShowAuthorities()" style="font-size: 10px; letter-spacing: 3px; color: #6A6050; text-transform: uppercase; margin-bottom: 10px; cursor: pointer;">
            ${state.showAuthorities ? '▾' : '▸'} Table of Authorities (${Object.keys(authorities).length} sources)
          </div>
      `;

      if (state.showAuthorities) {
        html += `<div style="display: grid; gap: 5px;">`;
        Object.entries(authorities).forEach(([key, a]) => {
          const isAct = state.activeCite === key;
          html += `
            <div onclick="toggleCite('${key}')" style="
              background: ${isAct ? '#1A1208' : '#111820'};
              border: 1px solid ${isAct ? '#D4B89666' : '#2A2520'};
              border-left: 2px solid ${isAct ? '#D4B896' : '#3A3028'};
              border-radius: 4px; padding: 8px 12px; cursor: pointer; transition: all 0.15s;
            ">
              <span style="font-size: 12px; color: #D4B896;">${a.cite}</span>
              <span style="font-size: 11px; color: #6A6050; margin-left: 10px;">${a.ref}</span>
              ${isAct ? `<div style="font-size: 11px; color: #A0988A; margin-top: 5px; line-height: 1.5;">${a.note}</div>` : ''}
            </div>
          `;
        });
        html += `</div>`;
      }

      html += `</div>`;

      // Anchor Language
      html += `
        <div style="border: 1px solid #D4B89633; border-left: 4px solid #D4B896; background: #141008; border-radius: 6px; padding: 16px 20px;">
          <div style="font-size: 10px; letter-spacing: 2px; color: #6A6050; margin-bottom: 8px;">ANCHOR LANGUAGE FOR MOTION</div>
          <div style="font-size: 13px; color: #D4B896; line-height: 1.7; font-style: italic;">
            "Movant asserts these grounds both as TLH's successor in interest to the title acquired in December 2021, and independently as a non-party whose property rights are directly threatened by a judgment entered in proceedings from which she was entirely absent. The former position gives her TLH's preserved substantive defenses; the latter position gives her complete immunity from any waiver, forfeiture, or preclusion argument grounded in the conduct — or absence — of any party to the underlying proceeding."
          </div>
          <div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px;">
            ${["orcp71b", "orcp71c", "jasper", "portland", "citizens", "heritage"].map(renderCiteTag).join('')}
          </div>
        </div>

        <div style="border: 1px solid #6A605033; border-left: 4px solid #6A6050; background: #10141A; border-radius: 6px; padding: 16px 20px; margin-top: 16px;">
          <div style="font-size: 10px; letter-spacing: 2px; color: #6A6050; margin-bottom: 8px;">PROCEDURAL NOTE — ACCOMPANYING PLEADING</div>
          <div style="font-size: 13px; color: #D4B896; line-height: 1.7; font-style: italic;">
            "Although ORCP 71 B(1) requires an accompanying pleading for motions under grounds (a), (b), and (c), that requirement does not extend to ground (d), under which this motion is brought. Movant has nonetheless tendered a proposed Complaint in Intervention with her concurrent ORCP 33 B motion, out of an abundance of caution — not because intervention is a prerequisite to tendering that pleading, but to ensure the Court has a complete picture of Movant's claims should intervention be deemed necessary."
          </div>
          <div style="margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px;">
            ${["orcp71b", "duvall"].map(renderCiteTag).join('')}
          </div>
        </div>

        <div style="text-align: center; margin-top: 20px; font-size: 10px; color: #3A3028; letter-spacing: 2px;">
          17CV38591 · Click any citation tag to view authority
        </div>
      `;

      document.getElementById('app').innerHTML = html;
    }

    render();
  </script>
</body>
</html>
