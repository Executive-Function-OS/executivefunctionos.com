<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>EFOS · Private Case Radar</title>
  <style>
    :root {
      --bg-slate: #0F172A;
      --bg-card: #1E293B;
      --bg-card-hover: #263449;
      --text-chalk: #F8FAFC;
      --text-muted: #94A3B8;
      --signal-teal: #0D9488;
      --teal-bright: #14B8A6;
      --resonant-amber: #D97706;
      --amber-bright: #F59E0B;
      --urgent-red: #EF4444;
      --calm-green: #10B981;
      --border-subtle: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-slate);
      color: var(--text-chalk);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      line-height: 1.45;
      padding: 16px;
      max-width: 1180px;
      margin: 0 auto;
    }
    /* Lock Screen */
    #lock-screen {
      max-width: 440px;
      margin: 10vh auto;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-top: 5px solid var(--signal-teal);
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
      text-align: center;
    }
    #lock-screen h1 {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 8px;
    }
    #lock-screen p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }
    .pass-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.05rem;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: #0F172A;
      color: var(--text-chalk);
      margin-bottom: 12px;
      text-align: center;
    }
    .pass-input:focus {
      outline: 2px solid var(--teal-bright);
      border-color: transparent;
    }
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .unlock-btn {
      width: 100%;
      padding: 13px;
      font-size: 1rem;
      font-weight: 800;
      border: none;
      border-radius: 10px;
      background: var(--signal-teal);
      color: var(--text-chalk);
      cursor: pointer;
    }
    .unlock-btn:hover { background: var(--teal-bright); }
    #err-msg {
      color: #FCA5A5;
      font-size: 0.85rem;
      margin-top: 10px;
      min-height: 1.2em;
    }
    /* Dashboard Styles */
    .dash-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
      border: 1px solid var(--border-subtle);
      border-left: 6px solid var(--signal-teal);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 18px;
    }
    .title-group h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .title-group p {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-top: 4px;
    }
    .audio-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn {
      background: var(--signal-teal);
      color: var(--text-chalk);
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-amber { background: var(--resonant-amber); }
    .btn-stop { background: #475569; }
    .radar-strip {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 18px;
    }
    .radar-strip h2 {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--teal-bright);
      margin-bottom: 12px;
    }
    .timeline-row {
      display: grid;
      grid-template-columns: 110px 185px 1fr 115px;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
    }
    @media (max-width: 720px) {
      .timeline-row { grid-template-columns: 1fr 1fr; gap: 6px; padding: 9px 0; border-bottom: 1px solid rgba(51,65,85,0.4); }
      .bar-track { grid-column: 1 / -1; }
      .t-badge { text-align: right; }
    }
    .t-date { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; font-size: 0.86rem; }
    .t-label { font-weight: 600; font-size: 0.9rem; }
    .bar-track {
      background: #0F172A;
      height: 16px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }
    .bar-fill { height: 100%; border-radius: 8px; }
    .t-badge { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; text-align: right; font-weight: 700; }
    .case-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }
    .case-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    .card-urgent { border-left: 5px solid var(--urgent-red); }
    .card-soon   { border-left: 5px solid var(--amber-bright); }
    .card-steady { border-left: 5px solid var(--calm-green); }
    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .pill { font-size: 0.73rem; font-weight: 800; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
    .pill-red { background: rgba(239, 68, 68, 0.2); color: #FCA5A5; border: 1px solid #EF4444; }
    .pill-amber { background: rgba(245, 158, 11, 0.2); color: #FDE68A; border: 1px solid #F59E0B; }
    .pill-green { background: rgba(16, 185, 129, 0.2); color: #A7F3D0; border: 1px solid #10B981; }
    .case-title { font-size: 1.08rem; font-weight: 800; margin-bottom: 2px; }
    .case-num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.8rem; color: var(--teal-bright); margin-bottom: 8px; }
    .case-fact { font-size: 0.88rem; color: #CBD5E1; margin-bottom: 10px; }
    .next-step-box {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.86rem;
      margin-bottom: 12px;
    }
    .next-step-box strong { color: var(--amber-bright); display: block; font-size: 0.76rem; text-transform: uppercase; margin-bottom: 2px; }
    .card-links { display: flex; flex-wrap: wrap; gap: 6px; }
    .doc-link {
      font-size: 0.8rem;
      color: var(--teal-bright);
      text-decoration: none;
      font-weight: 600;
      background: rgba(13, 148, 136, 0.14);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(20, 184, 166, 0.35);
    }
    .speak-mini {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.76rem;
      cursor: pointer;
    }
  </style>
</head>

      <button type="submit" class="unlock-btn">Unlock Radar</button>
      <div id="err-msg"></div>
    </form>
  </div>

    function b64ToBytes(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    function bytesToB64(bytes) {
      let bin = '';
      const arr = new Uint8Array(bytes);
      for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
      return btoa(bin);
    }

    async function decryptWithCEK(cekRaw) {
      const cekKey = await crypto.subtle.importKey("raw", cekRaw, { name: "AES-GCM" }, false, ["decrypt"]);
      const pt = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(VAULT.piv) },
        cekKey,
        b64ToBytes(VAULT.ct)
      );
      return new TextDecoder().decode(pt);
    }

    async function handleUnlock(ev) {
      if (ev) ev.preventDefault();
      if (!window.crypto || !window.crypto.subtle) {
        window.location.href = "https://emphasis-gentle-fonts-discusses.trycloudflare.com/radar.html";
        return;
      }
      const rawInput = document.getElementById("pass-input").value || "";
      const norm = rawInput.toLowerCase().replace(/[^a-z0-9]/g, "");
      const errEl = document.getElementById("err-msg");
      errEl.textContent = "Unlocking...";

      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey("raw", enc.encode(norm), "PBKDF2", false, ["deriveKey"]);

      for (const slot of VAULT.keys) {
        try {
          const kek = await crypto.subtle.deriveKey(
            { name: "PBKDF2", salt: b64ToBytes(slot.s), iterations: 100000, hash: "SHA-256" },
            baseKey,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
          );
          const cekRaw = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: b64ToBytes(slot.iv) },
            kek,
            b64ToBytes(slot.wk)
          );
          const html = await decryptWithCEK(cekRaw);
          if (document.getElementById("remember-chk").checked) {
            localStorage.setItem("efos_radar_cek", bytesToB64(cekRaw));
          } else {
            sessionStorage.setItem("efos_radar_cek", bytesToB64(cekRaw));
          }
          renderDashboard(html);
          playSonicRadar();
          return;
        } catch (e) {
          // try next slot
        }
      }
      errEl.textContent = "Phrase not recognized. Try 'chapin 1995' or your truck plate.";
    }

    function renderDashboard(html) {
      document.getElementById("lock-screen").style.display = "none";
      const root = document.getElementById("app-root");
      root.innerHTML = html;
      root.style.display = "block";
    }

    function lockVault() {
      stopAudio();
      localStorage.removeItem("efos_radar_cek");
      sessionStorage.removeItem("efos_radar_cek");
      document.getElementById("app-root").innerHTML = "";
      document.getElementById("app-root").style.display = "none";
      document.getElementById("pass-input").value = "";
      document.getElementById("err-msg").textContent = "";
      document.getElementById("lock-screen").style.display = "block";
    }

    window.addEventListener("DOMContentLoaded", async () => {
      const saved = localStorage.getItem("efos_radar_cek") || sessionStorage.getItem("efos_radar_cek");
      if (saved) {
        try {
          const html = await decryptWithCEK(b64ToBytes(saved));
          renderDashboard(html);
        } catch (e) {
          localStorage.removeItem("efos_radar_cek");
          sessionStorage.removeItem("efos_radar_cek");
        }
      }
    });

    function stopAudio() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    function speakText(text) {
      stopAudio();
      if (!('speechSynthesis' in window)) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.03;
      window.speechSynthesis.speak(utter);
    }

    function speakCard(idx, ev) {
      if (ev && ev.target && ev.target.tagName === 'A') return;
      playTone(idx === 0 || idx === 1 ? 660 : idx === 2 ? 523.25 : 440, 0.14);
      speakText(scripts[idx]);
    }

    function speakAllSummary() {
      playSonicRadar();
      setTimeout(() => {
        speakText("Here is your Case Radar for Monday, November 2, 2026. " + scripts.join(" ... "));
      }, 900);
    }

    function playTone(freq, duration, delay = 0) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
      gain.gain.setValueAtTime(0.15, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + duration);
    }

    function playSonicRadar() {
      const notes = [
        { f: 783.99, d: 0.15, t: 0.00 },
        { f: 659.25, d: 0.15, t: 0.18 },
        { f: 587.33, d: 0.18, t: 0.36 },
        { f: 523.25, d: 0.22, t: 0.56 },
        { f: 392.00, d: 0.35, t: 0.80 }
      ];
      notes.forEach(n => playTone(n.f, n.d, n.t));
    }
  </script>
