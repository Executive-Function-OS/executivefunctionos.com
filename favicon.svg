<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="8" fill="#0F172A" />
  
  <!-- Subtle Grid Lines -->
  <line x1="16" y1="16" x2="48" y2="16" stroke="#334155" stroke-width="1.5" />
  <line x1="16" y1="32" x2="48" y2="32" stroke="#334155" stroke-width="1.5" />
  <line x1="16" y1="48" x2="48" y2="48" stroke="#334155" stroke-width="1.5" />

  <line x1="16" y1="16" x2="16" y2="48" stroke="#334155" stroke-width="1.5" />
  <line x1="32" y1="16" x2="32" y2="48" stroke="#334155" stroke-width="1.5" />
  <line x1="48" y1="16" x2="48" y2="48" stroke="#334155" stroke-width="1.5" />

  <line x1="16" y1="16" x2="48" y2="48" stroke="#334155" stroke-width="1" />
  <line x1="16" y1="48" x2="48" y2="16" stroke="#334155" stroke-width="1" />

  <!-- Nodes -->
  <!-- Top Row -->
  <circle cx="16" cy="16" r="4" fill="#F8FAFC" />
  <circle cx="32" cy="16" r="4" fill="#F8FAFC" />
  <circle cx="48" cy="16" r="4.5" fill="#0D9488" />

  <!-- Middle Row -->
  <circle cx="16" cy="32" r="4" fill="#F8FAFC" />
  <circle cx="32" cy="32" r="5" fill="#0D9488" />
  <circle cx="48" cy="32" r="4" fill="#F8FAFC" />

  <!-- Bottom Row -->
  <circle cx="16" cy="48" r="4" fill="#F8FAFC" />
  <circle cx="32" cy="48" r="4" fill="#F8FAFC" />
  <circle cx="48" cy="48" r="5" fill="#D97706" />
</svg>
